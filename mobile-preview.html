<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lailipur — Mobile Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #292426; color: #fcede6; font: 13px Arial, sans-serif; }
    .preview { width: min(390px, 100%); height: 100%; margin: 0 auto; display: grid; grid-template-rows: 40px minmax(0, 1fr); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; }
    h1 { font-size: 13px; font-weight: 500; margin: 0; }
    a { color: inherit; font-size: 12px; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #f2c8c4; outline-offset: 3px; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #fcede6; }
  </style>
</head>
<body>
  <div class="preview">
    <header><h1>Lailipur · Mobile preview</h1><a href="./#/home" target="_blank" rel="noopener">Full website ↗</a></header>
    <iframe src="./?v=mobile2#/home" title="Lailipur mobile website"></iframe>
  </div>
  <script>
    const page = new URLSearchParams(location.search).get('page');
    if (['home', 'about', 'classes', 'business', 'activities'].includes(page)) {
      document.querySelector('iframe').src = './?v=about3#/' + page;
    }
  </script>
</body>
</html>
